<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In – CareerAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Career<span class="accent">AI</span></div>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Log in to your account to continue</p>

    <div class="alert alert-info" id="loginNotice">Your session has expired. Please log in again.</div>
    <div class="alert alert-error" id="loginError">Invalid email or password. Please try again.</div>

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" placeholder="you@email.com" autocomplete="email"/>
      <span class="form-error" id="emailErr">Please enter a valid email.</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <span class="form-error" id="passErr">Password is required.</span>
      <p style="margin-top:8px;font-size:0.8rem;"><a href="forgot-password.html">Forgot password?</a></p>
    </div>

    <button class="btn-primary btn-full" id="loginBtn" onclick="handleLogin()">
      Log In
    </button>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Sign up free</a>
    </p>
    <p class="auth-footer" style="margin-top:8px;">
      <a href="../index.html">← Back to home</a>
    </p>
  </div>

  <script src="../js/main.js"></script>
  <script>
    // Show a notice if redirected here due to an expired session.
    if (new URLSearchParams(location.search).get('expired')) {
      document.getElementById('loginNotice').classList.add('visible');
    }

    function storeProfileFromAuth(data) {
      const existing = JSON.parse(localStorage.getItem('careerai_profile') || '{}');
      localStorage.setItem('careerai_profile', JSON.stringify({
        ...existing, fullname: data.user.fullname, email: data.user.email
      }));
    }

    function showLoginError(message) {
      const el = document.getElementById('loginError');
      el.textContent = message;
      el.classList.add('visible');
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      document.querySelectorAll('.form-error').forEach(e => e.classList.remove('visible'));
      document.getElementById('loginError').classList.remove('visible');
      document.getElementById('loginNotice').classList.remove('visible');

      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        document.getElementById('emailErr').classList.add('visible'); valid = false;
      }
      if (!password) {
        document.getElementById('passErr').classList.add('visible'); valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="loading-spinner"></span> Logging in…';
      btn.disabled = true;

      try {
        const { status, data } = await apiFetch('/api/auth/login', {
          method: 'POST', auth: false, body: { email, password }
        });
        if (data.success) {
          localStorage.setItem('careerai_token', data.token);
          localStorage.setItem('careerai_user', JSON.stringify(data.user));
          storeProfileFromAuth(data);
          window.location.href = 'dashboard.html';
          return;
        }
        showLoginError(status === 401
          ? 'Invalid email or password. Please try again.'
          : (data.message || 'Login failed. Please try again.'));
      } catch (err) {
        showLoginError(describeError(err));
      }
      btn.innerHTML = 'Log In'; btn.disabled = false;
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
