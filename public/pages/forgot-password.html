<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot password – CareerAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Career<span class="accent">AI</span></div>
    <h2>Forgot password?</h2>
    <p class="auth-subtitle">Enter your email and we’ll prepare a secure reset link.</p>

    <div class="alert alert-success" id="okMsg"></div>
    <div class="alert alert-error" id="errMsg"></div>
    <div class="alert alert-info" id="devLink"></div>

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" autocomplete="email" placeholder="you@email.com"/>
    </div>

    <button class="btn-primary btn-full" id="sendBtn" type="button" onclick="requestReset()">Send reset link</button>

    <p class="auth-footer"><a href="login.html">← Back to log in</a></p>
  </div>

  <script src="../js/main.js"></script>
  <script>
    async function requestReset() {
      const email = document.getElementById('email').value.trim();
      const err = document.getElementById('errMsg');
      const ok = document.getElementById('okMsg');
      const dev = document.getElementById('devLink');
      err.classList.remove('visible'); ok.classList.remove('visible'); dev.classList.remove('visible');

      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        err.textContent = 'Please enter a valid email.';
        err.classList.add('visible');
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      try {
        const { data } = await apiFetch('/api/auth/forgot-password', {
          method: 'POST', body: { email }, auth: false
        });
        if (data.success) {
          ok.textContent = data.message;
          ok.classList.add('visible');
          if (data.resetUrl) {
            dev.innerHTML = `Dev mode reset link: <a href="${escapeHtml(data.resetUrl)}">Open reset page</a>`;
            dev.classList.add('visible');
          }
        } else {
          err.textContent = data.message || 'Request failed.';
          err.classList.add('visible');
        }
      } catch (e) {
        err.textContent = describeError(e);
        err.classList.add('visible');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
