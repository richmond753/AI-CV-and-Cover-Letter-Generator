<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset password – CareerAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Career<span class="accent">AI</span></div>
    <h2>Choose a new password</h2>
    <p class="auth-subtitle">Use at least 8 characters.</p>

    <div class="alert alert-error" id="errMsg"></div>
    <div class="alert alert-success" id="okMsg"></div>

    <div class="form-group">
      <label class="form-label" for="pw">New password</label>
      <input class="form-control" id="pw" type="password" autocomplete="new-password" minlength="8"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="pw2">Confirm password</label>
      <input class="form-control" id="pw2" type="password" autocomplete="new-password"/>
    </div>

    <button class="btn-primary btn-full" id="saveBtn" type="button" onclick="resetPassword()">Update password</button>
    <p class="auth-footer"><a href="login.html">← Back to log in</a></p>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    if (!token) {
      document.getElementById('errMsg').textContent = 'Missing reset token. Request a new link from the forgot-password page.';
      document.getElementById('errMsg').classList.add('visible');
      document.getElementById('saveBtn').disabled = true;
    }

    async function resetPassword() {
      const err = document.getElementById('errMsg');
      const ok = document.getElementById('okMsg');
      err.classList.remove('visible'); ok.classList.remove('visible');
      const newPassword = document.getElementById('pw').value;
      const confirm = document.getElementById('pw2').value;
      if (newPassword.length < 8) {
        err.textContent = 'Password must be at least 8 characters.';
        err.classList.add('visible'); return;
      }
      if (newPassword !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.classList.add('visible'); return;
      }
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      try {
        const { data } = await apiFetch('/api/auth/reset-password', {
          method: 'POST', body: { token, newPassword }, auth: false
        });
        if (data.success) {
          ok.textContent = data.message;
          ok.classList.add('visible');
          setTimeout(() => { location.href = 'login.html'; }, 1500);
        } else {
          err.textContent = data.message || 'Reset failed.';
          err.classList.add('visible');
        }
      } catch (e) {
        err.textContent = describeError(e);
        err.classList.add('visible');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
